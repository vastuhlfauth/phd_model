[project]
name = "mobility-acquire"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "httpx",
    "mobility-common",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["acquire"]
package-dir = { acquire = "." }

[tool.uv.sources]
mobility-common = { workspace = true }
