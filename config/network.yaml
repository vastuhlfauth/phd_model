control_highways:
  - traffic_signals
  - stop
  - give_way
  - crossing
  - mini_roundabout
signal_highways:
  - traffic_signals
maxspeed_tokens_kmh:
  FR:urban: 50
  FR:rural: 80
  FR:zone30: 30
  FR:motorway: 130
  # TODO(confirm): map the symbolic walking speed to 5 km/h.
  walk: 5
  none: null
speed_context_tags:
  - zone:traffic
  - source:maxspeed
  - maxspeed:type
  - zone:maxspeed
speed_context_values:
  FR:urban: urban
  FR:rural: rural
  FR:zone30: zone30
  FR:motorway: motorway
car_speed:
  # TODO(confirm): validate these class/context defaults against the pilot.
  defaults_kmh_by_context:
    urban: 50
    rural: 80
    zone30: 30
    motorway: 130
  # TODO(confirm): validate the class-specific overrides against the pilot.
  class_overrides_kmh_by_context:
    urban:
      motorway: 130
      motorway_link: 80
      trunk: 90
      trunk_link: 80
    rural:
      motorway: 130
      motorway_link: 80
      trunk: 110
      trunk_link: 80
      primary: 90
      primary_link: 80
  # TODO(confirm): calibrate realism factors by class at R4.
  realism_factor_by_highway:
    motorway: 1.0
    motorway_link: 1.0
    trunk: 1.0
    trunk_link: 1.0
    primary: 1.0
    primary_link: 1.0
    secondary: 1.0
    secondary_link: 1.0
    tertiary: 1.0
    tertiary_link: 1.0
    unclassified: 1.0
    residential: 1.0
    living_street: 1.0
    service: 1.0
    track: 1.0
    road: 1.0
    pedestrian: 1.0
    footway: 1.0
    path: 1.0
    cycleway: 1.0
    bridleway: 1.0
    steps: 1.0
    corridor: 1.0
    platform: 1.0
    busway: 1.0
    default: 1.0
  urban_density:
    # TODO(confirm): calibrate the edge-centroid buffer radius on the pilot.
    radius_m: 500
    # TODO(confirm): use only when tagged urban/rural labels cannot fit a threshold.
    fallback_threshold_km: 1.0
    # TODO(confirm): review the length-weighted agreement fitting rule.
    fit_strategy: max_length_weighted_agreement
  delays:
    # TODO(confirm): calibrate fixed delay per directional control.
    per_control_s: 5
    # TODO(confirm): calibrate the smaller delay at complex to-nodes.
    at_to_node_s: 2
    # TODO(confirm): confirm the degree threshold for a complex to-node.
    degree_threshold: 3
  # TODO(confirm): confirm speed-limit buckets for scenario time splits.
  speed_limit_bucket_upper_bounds_kmh:
    - 30
    - 50
    - 80
    - 110
mph_to_kmh: 1.609344
busway_values:
  - lane
  - opposite_lane
  - shared_lane
  - opposite_share_busway
bike_classes:
  separated_track_path:
    - highway=cycleway
    - cycleway=track
    - cycleway:left=track
    - cycleway:right=track
    - cycleway:both=track
    - highway=path+bicycle=designated
  painted_lane:
    - cycleway=lane
    - cycleway:left=lane
    - cycleway:right=lane
    - cycleway:both=lane
  bus_lane:
    - cycleway=share_busway
    - cycleway:left=share_busway
    - cycleway:right=share_busway
    - busway+cycling_access
  low_speed:
    - highway=living_street
    - maxspeed<=30
    - bicycle_road=yes
  mixed_traffic:
    - other_bike_accessible_roads
tile_size_m: 50000
