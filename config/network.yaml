access_rules:
  car:
    precedence:
      - motorcar
      - motor_vehicle
      - access
    denied:
      - "no"
      - private
      - agricultural
      - forestry
      - delivery
      - emergency
      - use_sidepath
    hard_excluded_highways:
      - platform
      - busway
      - steps
      - corridor
      - bus_stop
      - elevator
    excluded_highways:
      - track
      - footway
      - path
      - steps
      - pedestrian
      - cycleway
      - bridleway
    mode_specific_only_highways:
      - footway
      - path
      - pedestrian
      - cycleway
      - bridleway
    explicit_allowed_values:
      - "yes"
      - destination
      - permissive
      - designated
      - customers
    default_allowed: true
  bike:
    precedence:
      - bicycle
      - access
    denied:
      - "no"
      - private
      - agricultural
      - forestry
      - delivery
      - emergency
      - use_sidepath
    excluded_highways:
      - motorway
      - motorway_link
      - footway
      - steps
    mode_specific_only_highways:
      - footway
      - steps
    default_allowed: true
  foot:
    precedence:
      - foot
      - access
    denied:
      - "no"
      - private
      - agricultural
      - forestry
      - delivery
      - emergency
      - use_sidepath
    excluded_highways:
      - motorway
      - motorway_link
    included_highways:
      - footway
      - path
      - steps
      - pedestrian
      - living_street
    sidewalk_values:
      - "yes"
      - both
      - left
      - right
      - separate
    default_allowed: true
oneway_yes:
  - "yes"
  - "1"
  - "true"
oneway_no:
  - "no"
  - "0"
  - "false"
oneway_reverse:
  - "-1"
control_highways:
  - traffic_signals
  - stop
  - give_way
  - crossing
  - mini_roundabout
signal_highways:
  - traffic_signals
maxspeed_tokens_kmh:
  FR:urban: 50
  FR:rural: 80
  FR:zone30: 30
  FR:motorway: 130
  # TODO(confirm): map the symbolic walking speed to 5 km/h.
  walk: 5
  none: null
speed_context_tags:
  - zone:traffic
  - source:maxspeed
  - maxspeed:type
  - zone:maxspeed
speed_context_values:
  FR:urban: urban
  FR:rural: rural
  FR:zone30: zone30
  FR:motorway: motorway
car_speed:
  # TODO(confirm): validate these class/context defaults against the pilot.
  defaults_kmh_by_context:
    urban: 50
    rural: 80
    zone30: 30
    motorway: 130
  # TODO(confirm): validate the class-specific overrides against the pilot.
  class_overrides_kmh_by_context:
    urban:
      motorway: 130
      motorway_link: 80
      trunk: 90
      trunk_link: 80
    rural:
      motorway: 130
      motorway_link: 80
      trunk: 80
      trunk_link: 80
      primary: 80
      primary_link: 80
  # TODO(confirm): default-only caps for low-speed ways.
  default_caps_kmh_by_highway:
    living_street: 20
    service: 20
    track: 20
    residential: 50
    footway: 20
    path: 20
    cycleway: 20
    pedestrian: 20
    bridleway: 20
  # TODO(confirm): rural trunk and primary with explicit oneway=yes.
  rural_oneway_speed_kmh_by_highway:
    trunk: 110
    primary: 110
  # TODO(confirm): calibrate realism factors by class at R4.
  realism_factor_by_highway:
    motorway: 1.0
    motorway_link: 1.0
    trunk: 1.0
    trunk_link: 1.0
    primary: 1.0
    primary_link: 1.0
    secondary: 1.0
    secondary_link: 1.0
    tertiary: 1.0
    tertiary_link: 1.0
    unclassified: 1.0
    residential: 1.0
    living_street: 1.0
    service: 1.0
    track: 1.0
    road: 1.0
    pedestrian: 1.0
    footway: 1.0
    path: 1.0
    cycleway: 1.0
    bridleway: 1.0
    steps: 1.0
    corridor: 1.0
    platform: 1.0
    busway: 1.0
    default: 1.0
  urban_density:
    # TODO(confirm): calibrate the focal-disc radius on the pilot.
    radius_m: 500
    # TODO(confirm): validate grid resolution and tagged-edge agreement on the pilot.
    grid_cell_m: 50
    # TODO(confirm): use only when tagged urban/rural labels cannot fit a threshold.
    fallback_threshold_km: 1.0
  delays:
    # TODO(confirm): calibrate fixed delays per directional control.
    signal_s: 15
    stop_s: 5
    give_way_s: 2
    mini_roundabout_s: 3
    crossing_s: 0
    # TODO(confirm): calibrate the smaller delay at complex to-nodes.
    at_to_node_s: 2
    # TODO(confirm): confirm the degree threshold for a complex to-node.
    degree_threshold: 3
  # TODO(confirm): confirm speed-limit buckets for scenario time splits.
  speed_limit_bucket_upper_bounds_kmh:
    - 30
    - 50
    - 80
    - 110
mph_to_kmh: 1.609344
busway_values:
  - lane
  - opposite_lane
  - shared_lane
  - opposite_share_busway
bike_classes:
  separated_track_path:
    - highway=cycleway
    - cycleway=track
    - cycleway:left=track
    - cycleway:right=track
    - cycleway:both=track
    - highway=path+bicycle=designated
  painted_lane:
    - cycleway=lane
    - cycleway:left=lane
    - cycleway:right=lane
    - cycleway:both=lane
  bus_lane:
    - cycleway=share_busway
    - cycleway:left=share_busway
    - cycleway:right=share_busway
    - busway+cycling_access
  low_speed:
    - highway=living_street
    - maxspeed<=30
    - bicycle_road=yes
  mixed_traffic:
    - other_bike_accessible_roads
# TODO(confirm): validate bike class/highway caps and interpolation accuracy.
bike_speed_table:
  grade_min: -0.20
  grade_max: 0.20
  grade_step: 0.005
  clipped_grade_report_limit: 20
  speed_tolerance_kmh: 0.1
  energy_relative_tolerance: 0.01
  class_cap_kmh:
    separated_track_path: 25
    low_speed: 25
    painted_lane: 30
    bus_lane: 30
    mixed_traffic: 30
  highway_cap_kmh:
    living_street: 20
    footway: 10
    pedestrian: 10
