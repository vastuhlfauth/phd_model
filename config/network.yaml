access_rules:
  car:
    precedence:
      - motorcar
      - motor_vehicle
      - access
    denied:
      - "no"
      - private
      - agricultural
      - forestry
      - delivery
      - emergency
      - use_sidepath
    hard_excluded_highways:
      - platform
      - busway
      - steps
      - corridor
      - bus_stop
      - elevator
    excluded_highways:
      - track
      - footway
      - path
      - steps
      - pedestrian
      - cycleway
      - bridleway
    mode_specific_only_highways:
      - footway
      - path
      - pedestrian
      - cycleway
      - bridleway
    explicit_allowed_values:
      - "yes"
      - destination
      - permissive
      - designated
      - customers
    default_allowed: true
  bike:
    precedence:
      - bicycle
      - access
    denied:
      - "no"
      - private
      - agricultural
      - forestry
      - delivery
      - emergency
      - use_sidepath
    excluded_highways:
      - motorway
      - motorway_link
      - footway
      - steps
    mode_specific_only_highways:
      - footway
      - steps
    default_allowed: true
  foot:
    precedence:
      - foot
      - access
    denied:
      - "no"
      - private
      - agricultural
      - forestry
      - delivery
      - emergency
      - use_sidepath
    excluded_highways:
      - motorway
      - motorway_link
    included_highways:
      - footway
      - path
      - steps
      - pedestrian
      - living_street
    sidewalk_values:
      - "yes"
      - both
      - left
      - right
      - separate
    default_allowed: true
