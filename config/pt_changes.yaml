  notes: 'Rejected 2026-10-14: not a ref-normalisation issue (GTFS route_short_name
    ''5'' matches OSM ref ''5'' exactly in both dated extracts; a repo-wide audit
    found zero route_short_name values with a leading zero, so no other route is affected
    and normalise_ref needed no change). Root cause: OSM gained two additional ref=''5''
    relations by 2024 (16438549/16438550, ''Lianes 5 -> Villenave-d''Ornon Courrejean'',
    alongside the original 2425811/2425812 ''-> Piscine Chambery''), a real route-variant
    addition, not a mapping error. Because ''05''/''Lianes 5'' is BHNS-classified,
    coverage counts only ways tagged busway/lanes:bus, which are sparsely mapped on
    this corridor: 2022 barely passed (a 3-stop remnant, 100% covered after cutting,
    just clears theta=0.9) and 2024 falls to 66.7% (4/6) after cutting, below theta=0.9.
    User confirms the line has existed well before 2022, so this is a false positive
    from OSM bus-lane tagging incompleteness, not a real change.'
