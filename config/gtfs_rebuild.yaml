reference_date: '2026-10-13'
osm_lifecycle_prefixes:
- construction
- proposed
- disused
- abandoned
osm_source_ids:
  '2022-01-01': osm-2022
  '2024-01-01': osm-2024
osm_cache_root: data/interim/osm_pt_stops
osm_route_cache_root: data/interim/osm_pt_routes
calibration:
  r_m:
  - 25
  - 50
  - 100
  theta:
  - 0.5
  - 0.6
  - 0.7
  - 0.8
  - 0.9
  k:
  - 1
  - 2
  - 3
  geometry_share:
  - 0.3
  - 0.5
  - 0.7
chosen:
  bus:
    # TODO(confirm): screening only; bus is never applied automatically
    # (section 5.6 2026-10-14 decision) because its false-change rate stays
    # high at every grid point (an OSM bus-route mapping-completeness gap,
    # not a tuning issue). Candidates go to config/pt_changes.yaml's
    # to_review/not_applied for manual confirmation.
    r_m: 100
    k: 1
    geometry_share: 0.3
    theta: 0.9
  ferry:
    # TODO(confirm): screening only; same rule as bus (never auto-applied).
    r_m: 100
    k: 1
    geometry_share: 0.3
    theta: 0.9
  metro:
    # Confirmed 2026-10-14: known cases 9/9, F1 1.00, 0 presumed-unchanged
    # routes (IDFM/STAR Rennes are restricted to known-case metro lines).
    r_m: 25
    k: 2
    geometry_share: 0.7
    theta: 0.5
  rail:
    # TODO(confirm): screening only, for manual review; rail is never
    # applied automatically (same policy as bus). Reuses metro's values
    # above because section 5.6 has no labelled rail known case; its own
    # false-change rate (17.01% of 194 presumed-unchanged SNCF routes,
    # 2026-10-14) reflects a separate, smaller OSM rail-mapping gap.
    r_m: 25
    k: 2
    geometry_share: 0.7
    theta: 0.5
  tram:
    # Confirmed 2026-10-14: known cases 7/8, F1 0.92, false-change 0.00% of
    # 20 presumed-unchanged routes. The one remaining known-case mismatch
    # (Bordeaux tram A, 2022) is a documented OSM data gap, not a parameter
    # issue (see docs/progress.md).
    r_m: 25
    k: 1
    geometry_share: 0.3
    theta: 0.5
networks:
  tbm_bordeaux:
    resource_id: 83024
  tcl_lyon:
    resource_id: 81943
  sete_agglopole:
    resource_id: 81575
  idfm:
    resource_id: 80921
    notes: Restricted to the route_type=1 metro lines of the known cases.
  star_rennes:
    resource_id: 83281
    notes: Version valid at reference_date (83282 starts the day after); restricted
      to route_type=1 metro lines a/b.
  lio_occitanie:
    resource_id: 81026
    notes: Restricted to patterns intersecting the two rural test EPCIs.
  remi:
    resource_id: 83530
    notes: Restricted to patterns intersecting the two rural test EPCIs.
  sncf:
    resource_id: 83582
    notes: Rail, manual review only; restricted to the five test EPCIs.
test_epcis:
  bordeaux_metropole:
    siren: '243300316'
    network: tbm_bordeaux
  metropole_de_lyon:
    siren: '200046977'
    network: tcl_lyon
  sete_agglopole_mediterranee:
    siren: '200066355'
    network: sete_agglopole
  couserans_pyrenees:
    siren: '200067940'
    notes: No network of its own (section 5.6); coverage checked spatially via liO/Remi
      stops inside the 2026 EPCI polygon.
  marche_occitane_val_danglin:
    siren: '200035137'
    notes: Same as Couserans-Pyrenees.
manual_review_networks:
- sncf
