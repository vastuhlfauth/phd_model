- id: bordeaux_tram_a_restructuring
  network: tbm_bordeaux
  route_id: '59'
  mode_family: tram
  epci: bordeaux_metropole
  opened: '2025-12-06'
  expected_2022: kept
  expected_2024: kept
  notes: '2026-10-15 correction of the former "bordeaux_tram_a_airport" case: the
    2026 GTFS main pattern for route 59 (tram A) is Le Haillan Rostand <-> La Gardette-Bassens-Carbon-Blanc
    and no longer reaches the airport (confirmed from real stop names in the cached
    GTFS extract). The openings CSV''s row NAQ-12 (confidence medium) describes the
    Dec 2025 restructuring that transferred the airport and Floirac Dravemont branches
    to lines F and E; A''s own remaining core corridor predates 2022 unchanged, so
    A is expected kept at both dates. The airport branch''s own history is tracked
    under bordeaux_tram_f_rename (route F) and the bordeaux_tram_a_merignac_airport
    confirmed edit in pt_changes.yaml, itself corrected 2026-10-15 to target route
    164 (F), not 59 (A).'
