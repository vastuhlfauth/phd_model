calibration:
  r_m:
  - 25
  - 50
  - 100
  theta:
  - 0.5
  - 0.6
  - 0.7
  - 0.8
  - 0.9
  k:
  - 1
  - 2
  - 3
  geometry_share:
  - 0.3
  - 0.5
  - 0.7
chosen:
  bus:
    # TODO(confirm): screening only; bus is never applied automatically
    # (section 5.6 2026-10-14 decision) because its false-change rate stays
    # high at every grid point (an OSM bus-route mapping-completeness gap,
    # not a tuning issue). Candidates go to config/pt_changes.yaml's
    # to_review/not_applied for manual confirmation.
    # 2026-10-15 national recompute: known cases 7/10, false-change 29.23%
    # of presumed-unchanged test-area routes. Outcome no longer uses a
    # calibrated theta or cutting -- kept/kept-renamed/dropped come from a
    # fixed 50%/30%/50% name-then-geometry match share (section 5.6 point
    # 2), so theta and k are null (no longer meaningful for this family).
    # 2026-10-15 national policy: retired, not applied even as a screening
    # cut rule any more (national_policy.families.bus) -- these values are
    # a historical reference only.
    r_m: 100
    k: null
    geometry_share: 0.3
    theta: null
  ferry:
    # TODO(confirm): screening only; same rule as bus (never auto-applied).
    # 2026-10-15 national recompute: known cases 7/10, false-change 29.23%
    # (reuses bus's parameters and known cases; theta/k null for the same
    # reason). Coverage is checked against member stops/piers only, within
    # a fixed 200 m, regardless of r_m.
    # 2026-10-15 national policy: retired, historical reference only
    # (national_policy.families.ferry).
    r_m: 100
    k: null
    geometry_share: 0.3
    theta: null
  metro:
    # Confirmed 2026-10-15 (national recompute): known cases 11/11, F1
    # 1.00, false-change 20.00% of presumed-unchanged test-area routes.
    # geometry_share moved from the former 0.7 (2026-10-14, 9/9 known
    # cases) to 0.3 now that the known-case set also covers the Lyon
    # metro B and Paris metro 4/12 extensions.
    # 2026-10-15 national policy: the goal is a national model with no
    # manual review, so this automatic rule is retired (not applied) even
    # though it scored well -- metro changes come only from the openings
    # list now (national_policy.families.metro); the false changes above
    # are not investigated further.
    r_m: 25
    k: 2
    geometry_share: 0.3
    theta: 0.5
  rail:
    # TODO(confirm): screening only, for manual review; rail is never
    # applied automatically (same policy as bus). Reuses metro's values
    # above for screening only. 2026-10-15 national recompute: known
    # cases 0/6 (the Nouvelle-Aquitaine TER cases are all obtained as
    # kept-renamed rather than the expected kept -- a genuine OSM
    # rail-relation-naming gap, not a parameter issue), false-change
    # 20.74% of presumed-unchanged SNCF routes.
    # 2026-10-15 national policy: retired, historical reference only
    # (national_policy.families.rail).
    r_m: 25
    k: 2
    geometry_share: 0.3
    theta: 0.5
  tram:
    # Confirmed 2026-10-15 (national recompute): known cases 12/12, F1
    # 1.00, false-change 0.00% of presumed-unchanged test-area routes
    # (now including the Lyon T4/T6 and Bordeaux tram C/E/F cases).
    # 2026-10-15 national policy: the only family still applied
    # automatically (national_policy.families.tram); the former BHNS/
    # express bus automatic cut rule is retired (BHNS now follows bus's
    # own default-keep-except-openings policy).
    r_m: 25
    k: 1
    geometry_share: 0.3
    theta: 0.5
