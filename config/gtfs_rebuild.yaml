osm_route_cache_root: data/interim/osm_pt_routes
national_policy:
  # 2026-10-15 decision: the goal is a national model built with no manual
  # review step. The per-family OSM-calibrated automatic rule below
  # (``chosen``) is retired for every family except tram -- including the
  # former BHNS/express bus automatic cut rule, which is retired too.
  # Metro, rail, bus and ferry keep every 2026 route in both past states
  # by default, changed only by the PT openings list's auto-applied
  # matches (``config/pt_changes.yaml``'s ``from_openings``, written by
  # ``mobgrid.pt apply-openings``). See docs/progress.md (2026-10-15,
  # "step 0 national policy") for the full decision record and
  # ``mobgrid.pt.pt_policy.resolve_route_presence`` for the precedence
  # rule, tested in tests/mobgrid/pt/test_pt_policy.py.
  decision_date: '2026-10-15'
  precedence:
  - openings_list
  - tram_automatic_rule
  - default_keep
  families:
    tram:
      rule: automatic_osm
      notes: Uses chosen.tram's confirmed parameters below (r_m=25, k=1,
        theta=0.5, geometry_share=0.3), applied automatically.
    metro:
      rule: default_keep_except_openings
      notes: The automatic rule's historical calibration (chosen.metro
        below, known 11/11, false-change 20.00%) is kept for reference
        only and no longer applied; metro changes come only from the
        openings list. Its false changes are not investigated further
        (2026-10-15 decision).
    rail:
      rule: default_keep_except_openings
      notes: Never applied automatically (unchanged policy); chosen.rail
        below is kept as a screening/review reference only.
    bus:
      rule: default_keep_except_openings
      notes: Never applied automatically, including the former BHNS/
        express automatic cut rule (now retired); chosen.bus below is kept
        as a screening/review reference only.
    ferry:
      rule: default_keep_except_openings
      notes: Never applied automatically (unchanged policy); chosen.ferry
        below is kept as a screening/review reference only.
  openings_list:
    source_csv: config/French transit openings 2022 to 2026.csv
    mapping_csv: config/pt_openings_mapping.csv
    include_row_confidence:
    - high
    - medium
    apply_match_confidence:
    - exact
    - stop-confirmed
    known_gap_state: add
    notes: 'Mapped with ``mobgrid.pt map-openings`` (one network at a
      time) or, for all networks in one resumable/logged run,
      ``mobgrid.pt map-and-apply-all``. Applied with ``mobgrid.pt
      apply-openings``, which writes config/pt_changes.yaml''s
      ``from_openings`` and logs every ambiguous/none/low-confidence row
      and every closed-before-2026 (state ``add``) row, one line each.
      2026-10-16: what a ``remove`` row does depends on its
      ``change_type`` (``new_line``/``reopening`` drop the route;
      ``extension`` cuts it at its old terminus; ``new_station`` removes
      only that stop -- see ``mobgrid.pt.pt_changes.OpeningDerivedChange
      .instruction_at`` and ``mobgrid.pt.route_edits``); ``keep``/
      ``modify`` are never an instruction and fall through to the tram
      rule or default keep.'
    network_resource_ids:
      Aix-Marseille-Provence: 81969
      Bibus (Brest Métropole): 43286
      CTS (Eurométropole de Strasbourg): 79220
      Citézen (SMiTU Thionville-Fensch): 80459
      Filibus (Chartres métropole): 80587
      Geneva tram 17 (Annemasse Agglo / Pôle métropolitain du Genevois français): 76779
      Grand Reims Mobilités: 80594
