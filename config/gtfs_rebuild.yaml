# GTFS rebuilding test (section 5.6 / step 0 of section 14.5).
#
# Score table, per-case results and the calibration rationale are written to
# docs/data/step0_gtfs_rebuild.md by packages/mobgrid/pt/gtfs_rebuild.py.

# Representative school-period weekday of the 2026 feeds (Tuesday), inside
# every test network's configured GTFS validity window and before the 2026
# Toussaint school holidays (both states use the same date; only the dated
# OSM extract differs).
reference_date: "2026-10-13"

# OSM lifecycle prefixes excluded from stop extraction (section 5.6, point 1).
osm_lifecycle_prefixes:
  - construction
  - proposed
  - disused
  - abandoned

# config/sources.yaml ids of the two dated France OSM extracts.
osm_source_ids:
  "2022-01-01": osm-2022
  "2024-01-01": osm-2024

# Cached Parquet of extracted OSM public-transport stops, one file per date;
# written once, read afterwards (never re-reads the PBF).
osm_cache_root: data/interim/osm_pt_stops
osm_route_cache_root: data/interim/osm_pt_routes

calibration:
  r_m: [25, 50, 100]
  theta: [0.5, 0.6, 0.7, 0.8, 0.9]
  k: [1, 2, 3]
  geometry_share: [0.3, 0.5, 0.7]

# Recommended by the calibration script; TODO(confirm) after reading
# docs/data/step0_gtfs_rebuild.md.
# TODO(confirm): recommended by the calibration script of 2026-10-12; bus has
# a very weak fit (F1 <= 0.02 at every grid point) and should not be trusted
# without manual review -- see the "Known limitation, bus family" note in
# docs/data/step0_gtfs_rebuild.md before confirming.
chosen:
  bus:
    r_m: null
    k: null
    geometry_share: null
    theta: null
  tram:
    r_m: null
    k: null
    geometry_share: null
    theta: null
  metro:
    r_m: null
    k: null
    geometry_share: null
    theta: null
  rail:
    r_m: null
    k: null
    geometry_share: null
    theta: null
  ferry:
    r_m: null
    k: null
    geometry_share: null
    theta: null

# transport.data.gouv.fr GTFS resource ids, resolved to local paths through
# config/gtfs_inventory.csv at run time.
networks:
  tbm_bordeaux:
    resource_id: 83024
  tcl_lyon:
    resource_id: 81943
  sete_agglopole:
    resource_id: 81575
  idfm:
    resource_id: 80921
    notes: Restricted to the route_type=1 metro lines of the known cases.
  star_rennes:
    resource_id: 83281
    notes: >-
      Version valid at reference_date (83282 starts the day after);
      restricted to route_type=1 metro lines a/b.
  lio_occitanie:
    resource_id: 81026
    notes: Restricted to patterns intersecting the two rural test EPCIs.
  remi:
    resource_id: 83530
    notes: Restricted to patterns intersecting the two rural test EPCIs.
  sncf:
    resource_id: 83582
    notes: Rail, manual review only; restricted to the five test EPCIs.

test_epcis:
  bordeaux_metropole:
    siren: "243300316"
    network: tbm_bordeaux
  metropole_de_lyon:
    siren: "200046977"
    network: tcl_lyon
  sete_agglopole_mediterranee:
    siren: "200066355"
    network: sete_agglopole
  couserans_pyrenees:
    siren: "200067940"
    notes: >-
      No network of its own (section 5.6); coverage checked spatially via
      liO/Remi stops inside the 2026 EPCI polygon.
  marche_occitane_val_danglin:
    siren: "200035137"
    notes: Same as Couserans-Pyrenees.

manual_review_networks:
  - sncf

