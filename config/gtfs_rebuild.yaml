      RATP; Société des grands projets (IDFM): 80921
      RTM (Aix-Marseille-Provence): 81969
      SAM (Sète Agglopôle Méditerranée): 81575
      SNCF Réseau / RFI; TER Auvergne-Rhône-Alpes: 83582
      SNCF Voyageurs (IDFM): 80921
      SNCF Voyageurs / SNCF Réseau (IDFM): 80921
