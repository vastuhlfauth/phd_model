# Input outside the Z1 signed caches and disclosure flag for the income table.
entd_cars: data/raw/entd2008/q_menage.csv
caution_cell_n: 100
checkpoint_dir: data/interim/budget/zahavi_income
# Adjacent levels are pooled from left to right; unknown income stays separate.
regression_level_order:
  income: [q1, q2, q3, q4, q5]
  population: [unknown, other_inactive, children_6_17, unemployed, employed, retired]
  weekday: [unknown, lundi, mardi, mercredi, jeudi, vendredi]
  density: [very_sparse, sparse, intermediate, dense]
  cars: [unknown, '0', '1', '2+']
